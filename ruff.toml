line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "W", "I"]
# E501 — длинные строки в промптах/описаниях осознанны.
# E701/E702 — компактные однострочники в билдерах парсеров и скоринге: так
# таблица условий читается лучше, чем растянутая на 3 строки каждая.
ignore = ["E501", "E701", "E702"]
