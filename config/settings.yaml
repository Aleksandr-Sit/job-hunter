# Основные настройки Job Hunter

matching:
  threshold: 55          # минимальный score для отправки в Telegram.
                         # 65→58 (DIAGNOSE 08.07); 58→55 (HEALTH_AUDIT Lever B,
                         # 25.07): зона 55-57 = +113 релевантных за историю
                         # (Treasury/DeFi ops, CEX/DEX, support), AI их уже одобрил.
  batch_size: 5          # вакансий за один запрос к Cerebras (500 chars × 5 ≈ 3k токенов/батч)

# Дообогащение вакансий с HH полным описанием.
# RSS отдаёт ~125 символов, из-за чего весь HH скорится по заголовку. Стадия
# качает страницу вакансии только для тех, кто ПРОШЁЛ предфильтр (замер
# 19.08.2026: 56 штук, ~60 c и ~48 МБ на прогон), и пересчитывает отбор.
# Выключить = вернуться к слепому скорингу HH, пайплайн при этом рабочий.
hh_enrich:
  enabled: true
  # Потолок скачиваний за прогон. Поднят 120 → 180 вместе с восемью новыми
  # HH-запросами (см. parsers.hh.search_queries, замер 26.08.2026): они дают
  # +76 вакансий сквозь гейт, и при старом потолке часть выигрыша срезалась бы
  # самим предохранителем. Цена по замеру 19.08: ~0.62 c и ~780 КБ на страницу,
  # то есть 180 штук ≈ 110 c и ≈ 140 МБ на прогон.
  limit: 180

scheduler:
  # interval_minutes: 60
  cron: "0 6,14 * * *"   # 10:00 и 18:00 по Самаре (UTC+4)

parsers:
  hh:
    enabled: true
    search_queries:
      - "Web3 специалист"
      - "Crypto operations"
      - "Web3 QA"
      - "DeFi operations"
      - "Blockchain operations"
      - "Web3 support"
      - "AI automation"
      - "Crypto community manager"
      - "Web3 менеджер"
      - "Digital asset operations"
      - "On-chain аналитик"
      - "Web3 аналитик"
      # CIS / Russian-speaking роли
      - "Менеджер СНГ"
      - "Комьюнити менеджер крипто"
      - "Русскоязычная поддержка"
      - "CIS operations"
      # Entry/junior — целевой сегмент (обучающие роли, низкий барьер)
      - "Стажёр крипто"
      - "Младший специалист поддержки"
      - "Оператор поддержки крипто"
      - "Junior crypto operations"
      - "Ассистент операционный"
      # AI automation (любая индустрия)
      - "AI automation specialist"
      - "Automation engineer"
      - "Автоматизация процессов"
      - "n8n разработчик"
      - "No-code разработчик"
      # Точное название профессии на русском рынке. Держать отдельным запросом:
      # существующие запросы про автоматизацию не находят его ВООБЩЕ — замер
      # 15.08.2026 по шести запросам ("AI automation", "Automation engineer",
      # "Автоматизация процессов", "n8n разработчик", "No-code разработчик",
      # "AI automation specialist") дал 157 вакансий и НИ ОДНОЙ со словом
      # «интегратор» в заголовке.
      #
      # История, чтобы не переигрывать: сначала этот запрос был отклонён замером
      # («+2 сквозь гейт, обе про продажи»). Вывод оказался неверным — причина была
      # не в запросе, а в criteria.yaml: роль ai_automation не знала слова
      # «AI-интегратор», и живая вакансия получала 0 баллов с причиной «нет ролевых
      # ключевых слов». После починки словаря те же вакансии дают 50 баллов.
      - "AI-интегратор"
      # ДОБАВЛЕНЫ ЗАМЕРОМ 26.08.2026 (28 запросов-кандидатов, 518 вакансий, у 516
      # выкачано полное описание). Существующие 46 запросов (база 845) находили
      # только 11 из 40 подошедших вакансий — эти восемь возвращают ещё 29.
      # Сквозной выхлоп восьмёрки: 206 вакансий → 76 сквозь гейт → 36 подошедших.
      #
      # ⚠️ «n8n» намеренно БЕЗ слова «разработчик»: уточнение сужает выдачу до
      # вакансий на программистов. Голое «n8n» — лучший запрос из всех замеренных
      # (12 подошедших), «n8n разработчик» оставлен выше как отдельный срез.
      - "n8n"
      - "Claude Code"
      - "нейросети автоматизация"
      - "AI-ассистент разработка"
      - "инженер ИИ-автоматизаций"
      - "инженер по AI-автоматизации"
      - "ИИ автоматизация процессов"
      - "AI Automation Engineer"
      # ОТКЛОНЕНЫ ТЕМ ЖЕ ЗАМЕРОМ 26.08.2026 — «инструментальные» запросы. Точность
      # по маркеру у них почти 100% (Cursor 36/36, Codex 24/24, вайб-кодинг 22/22),
      # но вайбкодинг просят у ДЕЙСТВУЮЩИХ разработчиков: Backend Node.js, Fullstack,
      # PHP/Laravel. Сквозной итог четырнадцати таких запросов: 297 вакансий → 60
      # сквозь гейт → 7 подошедших (2%) против 17% у восьмёрки выше. Не переоткрывать:
      # "Cursor разработка", "Codex", "GitHub Copilot", "вайбкодинг", "вайб-кодинг",
      # "vibe coding", "вайбкодер", "prompt engineer", "промпт-инженер",
      # "RAG разработчик", "AI разработчик", "LLM инженер", "AI engineer",
      # "AI продукт менеджер".
      # ОТКЛОНЕНЫ ЗАМЕРОМ (после починки словаря, 15.08.2026) — шумные, ноль сквозь
      # гейт: "внедрение ИИ" и "интеграция ИИ" (HR-аналитик, руководители отделов),
      # "AI агент" и "RAG разработчик" (backend R&D), "чат-бот разработчик" (QA),
      # "интеграция API" (1С, ERPNext), "AI ассистент" (личные ассистенты).
      # РФ-крипто под волну регулирования (RU_CRYPTO_MARKET_MAP, 22.07)
      - "AML аналитик криптовалюта"
      - "ЦФА оператор"
      - "Цифровой рубль тестировщик"
      - "Оператор криптообменник"
      - "KYC специалист крипто"
      - "Комплаенс криптовалюта"
      # Отслеживаемые РФ-работодатели (карта рынка)
      - "BitOK"
      - "Bitbanker"
      - "ABCEX"
      # Проверено замером HH 30.07.2026 (число = удалённых вакансий в срезе).
      # Это самый сильный поток на HH — сильнее, чем крипто-операции.
      # Старые запросы сохранены намеренно: выборка мала (RSS отдаёт ~20/запрос),
      # нулевой результат сегодня не значит, что запрос мёртв навсегда.
      - "ПОД ФТ"                              # 19
      - "финансовый мониторинг"               # 18
      - "AML специалист"                      # 16
      - "KYC специалист"                      # 16
      - "специалист технической поддержки"    # 19
      - "поддержка криптовалюта"              # 16
      - "служба поддержки"                    # 11
      - "специалист поддержки финтех"         # 11
      - "цифровые активы специалист"          # 20
      - "блокчейн специалист"                 # 8
    area: 113            # 113 = Россия (все регионы)
    # Второй проход по релевантности для запросов, упёршихся в потолок RSS (20).
    # Замер 15.08.2026 на 45 запросах: 530 уникальных → +333 новых (+63%).
    # Цена — до +27 HTTP-запросов за прогон (ненасыщенные запросы пропускаются).
    second_pass: true

  remoteok:
    enabled: true
    tags: []             # [] = все вакансии, или ["python", "backend"]

  cryptojoblist:
    enabled: true

  web3career:
    enabled: false      # 403 Forbidden на все запросы, включая RSS

  wellfound:
    enabled: false       # требует аккаунт, пока отключено

  laborx:
    enabled: true

  remote3:
    enabled: true

  contra:
    enabled: false       # фриланс-платформа, включи если нужно

  greenhouse:
    enabled: true
    companies:
      # Биржи
      - { slug: "okx",             name: "OKX" }           # ~250 вакансий
      - { slug: "bybit",           name: "Bybit" }         # ~129, много ops/AML (был ручным до 08.07)
      - { slug: "gemini",          name: "Gemini" }         # ~27 вакансий
      # Инфраструктура / кастодия
      - { slug: "fireblocks",      name: "Fireblocks" }     # ~58 вакансий
      - { slug: "ripple",          name: "Ripple" }         # ~159 вакансий
      - { slug: "consensys",       name: "Consensys" }      # ~10 вакансий
      - { slug: "coinbase",        name: "Coinbase" }       # ~100 вакансий
      # Добавлены (проверены через API)
      - { slug: "bitgo",           name: "BitGo" }          # ~46 вакансий
      - { slug: "bitpanda",        name: "Bitpanda" }       # ~47 вакансий
      # VC portfolio aggregators
      - { slug: "a16zcryptoteam",  name: "a16z Crypto Portfolio" }
      # Добавлены по данным (SOURCES_AUDIT §8, проба fetch'ем с VPS 08.07)
      - { slug: "blockchain",      name: "Blockchain.com" }  # ~35, много ops
      - { slug: "ondofinance",     name: "Ondo Finance" }    # RWA/DeFi
      - { slug: "layerzerolabs",   name: "LayerZero" }
      - { slug: "aptoslabs",       name: "Aptos" }
      - { slug: "b2c2",            name: "B2C2" }            # OTC, compliance
      - { slug: "figment",         name: "Figment" }        # staking-ops
      # Добавлены по данным (SOURCES_AUDIT §9, проба fetch'ем с VPS 13.07)
      - { slug: "luno",            name: "Luno" }            # AML/compliance/treasury ops
      - { slug: "nansen",          name: "Nansen" }          # compliance analyst, support (entry)

  ashby:
    enabled: true
    companies:
      # Биржи
      - { slug: "kraken.com",      name: "Kraken" }          # мигрировали с Lever
      # Инфраструктура / кошельки
      - { slug: "ledger",          name: "Ledger" }
      - { slug: "trust-wallet",    name: "Trust Wallet" }
      # Стейкинг / операции
      - { slug: "p2p.org",         name: "P2P.org" }
      # VC portfolio aggregators
      - { slug: "Paradigm",        name: "Paradigm Portfolio" }
      # Добавлены по данным (SOURCES_AUDIT §8, проба fetch'ем с VPS 08.07)
      - { slug: "Polymarket",      name: "Polymarket" }     # ~55, AML/compliance/ops
      - { slug: "stellar",         name: "Stellar" }
      - { slug: "alchemy",         name: "Alchemy" }
      - { slug: "turnkey",         name: "Turnkey" }
      # Добавлены по данным (SOURCES_AUDIT §9, проба fetch'ем с VPS 13.07)
      - { slug: "elliptic",        name: "Elliptic" }        # blockchain compliance, CSM
      # Проба fetch'ем 17.08.2026: 125 вакансий, из них 17 профильных
      # (Global Investigator, All-Source Intelligence Analyst). Через Ashby надёжнее,
      # чем слежкой по LinkedIn: приходит полное описание, а не только карточка.
      - { slug: "trm-labs",        name: "TRM Labs" }        # блокчейн-разведка, AML
      - { slug: "notabene",        name: "Notabene" }        # travel-rule, customer success

  lever:
    enabled: true
    companies:
      # Биржи / крупные игроки
      - { slug: "binance",         name: "Binance" }        # ~361 вакансия
      # Инфраструктура / кастодия
      - { slug: "celestia",        name: "Celestia" }
      - { slug: "anchorage",       name: "Anchorage Digital" }  # ~49 вакансий
      # Fintech / payments
      - { slug: "moonpay",         name: "MoonPay" }        # ~14 вакансий
      # DeFi / протоколы
      - { slug: "safe",            name: "Safe" }           # ~16 вакансий
      - { slug: "gauntlet",        name: "Gauntlet" }       # ~6 вакансий
      - { slug: "1inch",           name: "1inch" }          # ~4 вакансии
      # Гейминг / NFT
      - { slug: "animocabrands",   name: "Animoca Brands" } # ~6 вакансий
      # Биржа (был ручным; часть ролей на кит. — режется гейтом языка)
      - { slug: "gate",            name: "Gate.io" }        # ~19, ops/KYC
      # Добавлены по данным (SOURCES_AUDIT §9, проба fetch'ем с VPS 13.07)
      - { slug: "merklescience",   name: "Merkle Science" } # blockchain intelligence, CSM

  linkedin:
    # Переписан 06.08.2026 на публичный guest-эндпоинт с geoId (JobSpy непригоден
    # для стран релокации: падает на Казахстане/Сербии/Армении, "Georgia" читает
    # как штат США). Прежняя причина отключения — HTTP 429 — на замере 06.08.2026
    # не воспроизвелась: 598 вакансий собрано без единого 429.
    enabled: true
    hours_old: 168          # вакансии не старше недели
    pages_per_query: 3      # до 30 карточек на запрос+страну
    max_descriptions: 400   # потолок запросов за описаниями (главный расход времени)
    delay_seconds: 0.7      # пауза между запросами, чтобы не ловить 429

    # Слежка за конкретными работодателями: ВСЕ их вакансии, без фильтра по стране
    # и по свежести. Для компаний, которые публикуются редко и которых легко
    # пропустить обычным поиском по ключевым словам.
    #
    # `id` — числовой orgId, НЕ слаг из адреса. Достаётся так:
    #   curl -A "<UA>" https://www.linkedin.com/company/<слаг> | grep -o 'urn:li:organization:[0-9]*'
    # Проверить, что ID верный, до добавления сюда:
    #   .../seeMoreJobPostings/search?f_C=<id>&geoId=92000000&start=0
    # Пустой ответ = вакансий сейчас нет; мусор из чужих компаний = ID неверный.
    watch_companies:
      - name: "AMLBot"                # крипто-комплаенс, remote worldwide
        id: "64276802"
      - name: "Match Systems"         # блокчейн-форензика, карьерной страницы нет
        id: "81872165"
      # Крупные крипто-комплаенс: публикуются регулярно, роли профильные
      # (Crypto Investigations, Global Investigator). ID проверены живым запросом
      # 17.08.2026 — оба отдали ровно свои вакансии.
      - name: "Chainalysis"         # свой ATS: на Greenhouse/Lever/Ashby их нет
        id: "10607336"
      # НЕ добавлять сюда Elliptic, Merkle Science и TRM Labs — они уже приходят
      # парсерами Ashby и Lever с полным описанием. Слежка их продублирует и
      # сожжёт лимит на описания (TRM Labs переведён в ashby 17.08.2026).
      # Web3 Tech в LinkedIn найти не удалось: слаги web3tech и web3-technologies
      # принадлежат ДРУГИМ компаниям («WEB3» и «Web3 Consulting»), проверено.

    # Замер 06.08.2026: NOT ухудшает выдачу и на LinkedIn (как и на HH) — на Кипре
    # с NOT пропали «Customer Support Specialist» и «KYC & Client Onboarding
    # Analyst», но остался мусорный «Chief Growth Officer». Поэтому NOT здесь нет.
    queries:
      - '("customer support" OR "customer success" OR "technical support" OR "support specialist" OR "operations specialist" OR "crypto operations" OR "community manager" OR AML OR KYC OR "compliance analyst" OR "QA tester") AND (crypto OR web3 OR blockchain OR fintech)'
      - '("Russian speaking" OR "Russian language" OR "Russian speaker" OR "fluent Russian")'

    # geoId проверены запросом: по каждому прочитаны локации вернувшихся вакансий.
    # ⚠️ Не брать geoId «на глаз»: у Армении ходил 102324862 (отдавал КАНАДУ),
    # у Черногории 104111274 (отдавал БРИТАНИЮ).
    geos:
      - { name: "Кипр",       id: "106774002" }
      - { name: "ОАЭ",        id: "104305776" }
      - { name: "Греция",     id: "104677530" }
      - { name: "Сербия",     id: "101855366" }
      - { name: "Турция",     id: "102105699" }
      - { name: "Таиланд",    id: "105146118" }
      - { name: "Армения",    id: "103030111" }
      - { name: "Грузия",     id: "106315325" }
      - { name: "Казахстан",  id: "106049128" }
      - { name: "Вьетнам",    id: "104195383" }
      - { name: "Индонезия",  id: "102478259" }
      # Черногория (100733275) не включена: замер 06.08.2026 — почти пусто по всем
      # направлениям (0-10 вакансий), тратить на неё проход смысла нет.

  habr:
    enabled: true        # Habr Career — серверный HTML .vacancy-card, РФ-крипто/финтех
                         # (МТС Финтех, Bitbanker и др.); запросы задаются в парсере

  telegram:
    enabled: true        # читает t.me/s/<channel> публично, без API-ключей

logging:
  level: "INFO"
  file: "data/logs/job-hunter.log"
