  linkedin:
    # Переписан 06.08.2026 на публичный guest-эндпоинт с geoId (JobSpy непригоден
    # для стран релокации: падает на Казахстане/Сербии/Армении, "Georgia" читает
    # как штат США). Прежняя причина отключения — HTTP 429 — на замере 06.08.2026
    # не воспроизвелась: 598 вакансий собрано без единого 429.
    enabled: true
    hours_old: 168          # вакансии не старше недели
    # С 13.10.2026 поиск идёт через публичную страницу /jobs/search: ОДИН запрос
    # отдаёт до 60 карточек (guest-поиск seeMoreJobPostings в тот день ушёл в 429).
    # pages_per_query теперь нужен только запасному guest-листанию — если публичная
    # страница вернулась не выдачей (стена логина, новая вёрстка).
    # ⚠️ Публичная страница почти не фильтрует по словам: на бессмыслицу отвечает
    # «647 jobs in Cyprus» — это ВСЕ вакансии страны по убыванию похожести. Хвост
    # из 60 — в основном шум (его срезает предфильтр), но там же редкие находки.
    pages_per_query: 3
    # Потолок запросов за описаниями — главный расход времени в прогоне.
    # Поднят 400 -> 1000 (30.08.2026). Боевой лог: «остановились на 400 вакансиях
    # из 1005» — две трети карточек выбрасывались КАЖДЫЙ прогон, а без описания
    # вакансия не скорится вовсе. Причина роста: после разбиения OR-запроса про
    # русский язык на четыре отдельных карточек стало втрое больше, а потолок
    # остался прежним. Цена: стадия LinkedIn ~9,5 мин на 400 описаний -> ~24 мин
    # на 1000, полный прогон ~11 -> ~26 мин. При интервале в 4 часа это проходит.
    # ⚠️ Нагрузка на LinkedIn выросла в 2,5 раза. Ограничений частоты сейчас НОЛЬ
    # (проверено по логам), но если появятся 429 — снижать pages_per_query 3 -> 2.
    # С 13.10.2026 потолок считается только по НЕувиденным вакансиям: описания уже
    # оценённых больше не качаются (skip_seen в парсере), раньше это было ~1000
    # лишних запросов за прогон.
    max_descriptions: 1000
    delay_seconds: 0.7      # пауза между запросами за ОПИСАНИЯМИ
    # Пауза между ПОИСКОВЫМИ запросами. Поиск ограничен по частоте жёстче описаний:
    # 13–14.10.2026 с VPS описания отвечали 200, поиск — 429 при паузе 0,7 с.
    # При 10 с — 4 из 6 ответов 200, отказы лечатся ожиданием 60–120 с (в парсере).
    # ~70 поисков × 10 с ≈ 12 минут на прогон.
    search_delay_seconds: 10
    # Потолок времени на всю стадию LinkedIn (поиск + описания), минут. После него
    # парсер отдаёт собранное. Без потолка терпеливые повторы после 429 тянули стадию
    # часами (замер 14.10.2026), а прогоны идут раз в 4 часа.
    max_minutes: 45
    # Ротация стран (14.10.2026): прогон ищет столько стран, сколько указано, —
    # те, что искались давнее всех. Все 11 стран занимали ~38 мин из 45, и на
    # описания оставалось ~7 (15–19 штук из ~1700 карточек). 4 страны x 6 запросов
    # ~ 14 мин; при 3 прогонах в день каждая страна — раз в сутки, а поиск берёт
    # вакансии за неделю (hours_old), так что пропусков нет. 0 — все страны.
    # 18.10.2026: 4 -> 6. За 3 дня на 4 странах стадия шла 15–35 мин из 45, пул
    # всегда пуст, докачка простаивала — запас тратим на свежесть: каждая страна
    # примерно раз в 16 ч вместо раза в сутки.
    geos_per_run: 6
    # Карточки без описания ждут в пуле li_pool; старше — выбрасываются (в лог).
    pool_max_age_days: 7

    # Слежка за конкретными работодателями: ВСЕ их вакансии, без фильтра по стране
    # и по свежести. Для компаний, которые публикуются редко и которых легко
    # пропустить обычным поиском по ключевым словам.
    #
    # `id` — числовой orgId, НЕ слаг из адреса. Достаётся так:
    #   curl -A "<UA>" https://www.linkedin.com/company/<слаг> | grep -o 'urn:li:organization:[0-9]*'
    # Проверить, что ID верный, до добавления сюда:
    #   .../seeMoreJobPostings/search?f_C=<id>&geoId=92000000&start=0
    # Пустой ответ = вакансий сейчас нет; мусор из чужих компаний = ID неверный.
    watch_companies:
      - name: "AMLBot"                # крипто-комплаенс, remote worldwide
        id: "64276802"
      - name: "Match Systems"         # блокчейн-форензика, карьерной страницы нет
        id: "81872165"
      # Крупные крипто-комплаенс: публикуются регулярно, роли профильные
      # (Crypto Investigations, Global Investigator). ID проверены живым запросом
      # 17.08.2026 — оба отдали ровно свои вакансии.
      - name: "Chainalysis"         # свой ATS: на Greenhouse/Lever/Ashby их нет
        id: "10607336"
      # НЕ добавлять сюда Elliptic, Merkle Science и TRM Labs — они уже приходят
      # парсерами Ashby и Lever с полным описанием. Слежка их продублирует и
      # сожжёт лимит на описания (TRM Labs переведён в ashby 17.08.2026).
      # Web3 Tech в LinkedIn найти не удалось: слаги web3tech и web3-technologies
      # принадлежат ДРУГИМ компаниям («WEB3» и «Web3 Consulting»), проверено.

    # Замер 06.08.2026: NOT ухудшает выдачу и на LinkedIn (как и на HH) — на Кипре
    # с NOT пропали «Customer Support Specialist» и «KYC & Client Onboarding
    # Analyst», но остался мусорный «Chief Growth Officer». Поэтому NOT здесь нет.
    # ⚠️ ПОТОЛОК ВЫДАЧИ У КАЖДОГО ЗАПРОСА СВОЙ — не объединять условия через OR.
    # Замер 26.08.2026 по четырём странам: один OR-запрос про русский язык отдал
    # 113 вакансий, те же четыре условия по отдельности — 229, из них 129 OR-запрос
    # НЕ находит вовсе (Account Manager Fintech/Payments, Sales Executive, Strategic
    # Sourcing Manager with Russian language). Объединение через OR не расширяет
    # выдачу, а режет её вчетверо: один потолок вместо четырёх. Тот же механизм, что
    # у RSS на HH — см. `second_pass` выше.
    queries:
      - '("customer support" OR "customer success" OR "technical support" OR "support specialist" OR "operations specialist" OR "crypto operations" OR "community manager" OR AML OR KYC OR "compliance analyst" OR "QA tester") AND (crypto OR web3 OR blockchain OR fintech)'
      # Русский язык — четыре РАЗДЕЛЬНЫХ запроса вместо прежнего одного OR-запроса.
      - '"Russian speaking"'
      - '"Russian language"'
      - '"Russian speaker"'
      - '"fluent Russian"'
      # Без кавычек и без OR: даёт кластер русскоязычной поддержки, который точные
      # фразы пропускают (в замере нашёл в том числе didlogic на Кипре).
      - 'Russian support specialist'
      # ОТКЛОНЁН ЗАМЕРОМ: '"written English"'. Запроса, который находит «английский
      # только письменный, без созвонов», не существует — LinkedIn ищет нечётко и
      # отдаёт English Speaking Tour Manager, копирайтеров и маркетологов. Рабочий
      # обходной путь — именно русскоязычные роли: там английский нужен для внутренней
      # переписки, а не для разговора с клиентом.

    # geoId проверены запросом: по каждому прочитаны локации вернувшихся вакансий.
    # ⚠️ Не брать geoId «на глаз»: у Армении ходил 102324862 (отдавал КАНАДУ),
    # у Черногории 104111274 (отдавал БРИТАНИЮ).
    geos:
      - { name: "Кипр",       id: "106774002" }
      - { name: "ОАЭ",        id: "104305776" }
      - { name: "Греция",     id: "104677530" }
      - { name: "Сербия",     id: "101855366" }
      - { name: "Турция",     id: "102105699" }
      - { name: "Таиланд",    id: "105146118" }
      - { name: "Армения",    id: "103030111" }
      - { name: "Грузия",     id: "106315325" }
      - { name: "Казахстан",  id: "106049128" }
      - { name: "Вьетнам",    id: "104195383" }
      - { name: "Индонезия",  id: "102478259" }
      # Черногория (100733275) не включена: замер 06.08.2026 — почти пусто по всем
      # направлениям (0-10 вакансий), тратить на неё проход смысла нет.

  habr:
    enabled: true        # Habr Career — серверный HTML .vacancy-card, РФ-крипто/финтех
                         # (МТС Финтех, Bitbanker и др.); запросы задаются в парсере

  telegram:
    enabled: true        # читает t.me/s/<channel> публично, без API-ключей

logging:
  level: "INFO"
  file: "data/logs/job-hunter.log"
