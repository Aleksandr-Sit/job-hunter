# Основные настройки Job Hunter

matching:
  threshold: 55          # минимальный score для отправки в Telegram.
                         # 65→58 (DIAGNOSE 08.07); 58→55 (HEALTH_AUDIT Lever B,
                         # 25.07): зона 55-57 = +113 релевантных за историю
                         # (Treasury/DeFi ops, CEX/DEX, support), AI их уже одобрил.
  batch_size: 5          # вакансий за один запрос к Cerebras (500 chars × 5 ≈ 3k токенов/батч)

# Дообогащение вакансий с HH полным описанием.
# RSS отдаёт ~125 символов, из-за чего весь HH скорится по заголовку. Стадия
# качает страницу вакансии только для тех, кто ПРОШЁЛ предфильтр (замер
# 19.08.2026: 56 штук, ~60 c и ~48 МБ на прогон), и пересчитывает отбор.
# Выключить = вернуться к слепому скорингу HH, пайплайн при этом рабочий.
hh_enrich:
  enabled: true
  # Потолок скачиваний за прогон. Поднят 120 → 180 вместе с восемью новыми
  # HH-запросами (см. parsers.hh.search_queries, замер 26.08.2026): они дают
  # +76 вакансий сквозь гейт, и при старом потолке часть выигрыша срезалась бы
  # самим предохранителем. Цена по замеру 19.08: ~0.62 c и ~780 КБ на страницу,
  # то есть 180 штук ≈ 110 c и ≈ 140 МБ на прогон.
  limit: 180

  # Потолок ПЕРЕСМОТРА отказов (_rescue_hh_rejects). Отдельный от `limit`: тот
  # ограничивает дообогащение выживших, этот — вакансий, отсеянных по обрезанному
  # RSS-описанию. Замер 05.09.2026: таких 206 за прогон, цена 0.87 c и 0.81 МБ на
  # страницу, то есть 220 штук ~ 3.2 мин и ~178 МБ на прогон (0.5 ГБ/сутки).
  # 18.10.2026: 220 -> 400. После пула и почасового сбора (25.09) приток в очередь
  # вырос до ~2400 в будни при пропуске 660 в сутки; 09-17.10 выброшено по сроку
  # 15 822. Основной приток срезан сужением запросов (parsers.hh.search_queries),
  # потолок поднят, чтобы разобрать хвост и будние пики. Боевой темп 18.10 —
  # 1.3 с и 0.84 МБ на страницу: 400 ~ 8.7 мин и ~340 МБ на прогон. 800 подряд hh
  # не проверялся ни разу; если выброс по сроку не уйдёт к нулю — следующий шаг 600.
  retry_limit: 400

scheduler:
  # interval_minutes: 60
  # 10:00, 14:00 и 18:00 по Самаре (UTC+4). Третий прогон добавлен 28.08.2026:
  # при двух проходах разрыв доходил до 12 часов, и вакансия, опубликованная сразу
  # после прогона, ждала полсуток. Боевой случай: «Customer Success Manager» в
  # Marketlead (150–200 тыс., удалённо) вышла в 18:06, прогон был в 14:10 — владелец
  # нашёл её сам через рекомендации HH раньше бота. На вакансиях с открытой вилкой
  # основная масса откликов прилетает в первые сутки, поэтому свежесть здесь
  # конвертируется в шанс попасть в первую десятку.
  # Цена: +50% парсинга, но AI платится только за НОВОЕ — seen-гейт и дедуп режут
  # уже виденное, поэтому третий проход дешевле первых двух.
  cron: "0 6,10,14 * * *"
  # Почасовой сбор HH в пул (25.09.2026). Только RSS по дате, без AI и без
  # скачивания описаний: ~70 лёгких запросов. Окно RSS — 20 свежих на запрос, и
  # замер показал 22 запроса, которые набирают их быстрее ночного разрыва в 16 ч
  # («служба поддержки» — за 6 минут). Всё, что вышло сверх окна, бот не видел
  # никогда. Сбор между прогонами складывает новое в пул, основной прогон его
  # разбирает. Пустая строка — выключить.
  hh_harvest_cron: "30 * * * *"
  # Сколько дней вакансия ждёт в пуле вердикта. Выброшенное по сроку пишется в лог.
  hh_pool_max_age_days: 14
  # Почасовая докачка описаний LinkedIn из пула (14.10.2026): только описания,
  # без поиска и AI. Карточки кладёт основной прогон, вердикт выносит он же.
  # :40 + 15 мин заканчивается до прогонов в :00 и не пересекается со сбором HH
  # в :30. Пустая строка — выключить.
  li_harvest_cron: "40 * * * *"
  li_harvest_minutes: 15
  # Межпрогонный дедуп (29.09.2026). Ключ отправленной карточки (компания+должность,
  # у Telegram — заголовок+начало текста) хранится столько дней; копия с тем же
  # ключом в любом следующем прогоне отбрасывается до AI. Аудит 28.09: без этого
  # «Тетрика» пришла 14 раз из разных городов, TG-репост — 7 раз за месяц.
  # Ключ пишется только для ОТПРАВЛЕННЫХ: копия вакансии, которую AI отклонил,
  # оценивается заново (у hh это бывает другой город с другим баллом).
  dedupe_window_days: 30

# Сторож чатов hh (26.10.2026, этап 1 — только чтение). Вопросы робота-рекрутёра
# терялись: он ждёт ответа 1–2 дня и уходит из чата (MOTIVITY, Data Light, Eqwile).
# Два раза в день сервер читает чаты откликов и присылает карточку с вариантом ответа
# по каждому чату, где ждут ответа. В hh ничего не отправляется. Подробно —
# src/hh_chats/watch.py.
hh_chats:
  enabled: true
  # 12:00 и 18:00 по Самаре (UTC+4) = 11:00 и 17:00 МСК.
  cron: "0 8,14 * * *"
  # Окно: чаты с активностью за столько дней. Робот может висеть с вопросом
  # неделями (MOTIVITY — три недели).
  since_days: 30
  # Папка (или файл) с cookie сессии hh. Вне git и вне образа (.gitignore,
  # .dockerignore), в контейнер — bind-mount только для чтения. Берутся все
  # *.txt и *.json папки; свежий экспорт перекрывает старый.
  cookie_path: config/hh_session
  # Потолок карточек за запуск: остальное придёт в следующий раз.
  max_cards: 10

parsers:
  hh:
    enabled: true
    # Элемент — строка (поиск по всему тексту вакансии) или словарь:
    #   { text: "...", field: name }   — искать только в НАЗВАНИИ (search_field=name);
    #   priority: low                  — в очереди пересмотра после остальных.
    # Сужение введено 18.10.2026 (аудит очереди пересмотра). У 17 запросов 20-я
    # вакансия RSS была моложе 4 ч даже в воскресенье: почасовой сбор брал с каждого
    # по 20 в час, до 480 в сутки, и они давали ~95% притока в очередь — «Продавец @
    # Магнит», стоматологи, ветврачи (hh ищет слова по всему тексту, «IT» и
    # «удалённо» не соблюдает). Очередь общая, поэтому по сроку умирали и находки
    # узких запросов. Замер RSS «как было -> только в названии», вакансий в сутки:
    # «менеджер по продажам IT» 480 -> 30, «…клиентами IT» 480 -> 23, «Ассистент
    # операционный» 480 -> 9, «Младший специалист поддержки» 480 -> 2, «Automation
    # engineer» 468 -> 11, «Автоматизация процессов» 480 -> 5, «Менеджер СНГ» 480 -> 5,
    # «финансовый мониторинг» 378 -> 3, «AI automation» 224 -> 6. Всё, что эти запросы
    # находили по описанию и что AI оценил высоко, в замере находили и узкие запросы.
    # УДАЛЕНЫ ТЕМ ЖЕ АУДИТОМ — не возвращать без нового замера:
    #   "служба поддержки"          480/сут; и в названии 480 (hh подставляет синонимы:
    #                               «клиентский сервис», «работа с клиентами»)
    #   "цифровой рубль поддержка"  307/сут: «Инженер-электроник» x12, обжигальщик,
    #                               рентген-лаборант (hh ловит «рубль» в зарплате);
    #                               в названии — 0. При добавлении 15.09 дал 3/1
    #                               (инженер поддержки платформы ЦР, РСХБ-Интех) —
    #                               цена удаления; ЦР-вакансии ищет «цифровые валюты»
    #   "Web3 специалист", "Web3 менеджер", "Web3 аналитик" — ~180/сут каждый, hh в
    #                               связке теряет «web3» (врачи телемедицины, Data
    #                               Scientist); в названии 0–3. Заменены одним "web3"
    #   "customer success manager"  вложен в "customer success" (2 своих из 29)
    #   продажи-«охота» — решение владельца 18.10.2026: «продажи не в приоритете,
    #   ближе работа с действующими клиентами (аккаунт, CSM) и поддержка; продажи —
    #   только на входящих». Из 421 карточки hh >=55 с 25.09: аккаунт/CSM 69,
    #   поддержка 45, входящие продажи 31, активные и общие продажи 182.
    #     "sales manager удалённо"  480/сут, сужение не меняет выдачу (Тетрика x13)
    #     "B2B продажи удалённо"    354/сут, «лидорубы», агенты недвижимости
    #     "BDM", "business development manager", "sales development representative",
    #     "account executive", "сейлз" — почти целиком активный поиск клиентов
    #   Кандидаты на замену «только в названии» замерены и НЕ взяты: "входящие" 446/сут
    #   и "входящие заявки" 172/сут (риелторы, банкротство, окна), "key account
    #   manager" 214/сут (FMCG, «Лемана ПРО»), "account manager" и "менеджер по
    #   сопровождению клиентов" (синонимы hh -> 480/сут «менеджеров по продажам»).
    search_queries:
      - "Crypto operations"
      - "Web3 QA"                           # 13/сут, не переполнен — оставлен
      - "DeFi operations"
      - "Blockchain operations"
      - "Web3 support"                      # 2 своих >=55 в замере 18.10 — оставлен
      - { text: "AI automation", field: name }
      - "Crypto community manager"
      - "Digital asset operations"
      - "On-chain аналитик"
      - "web3"                              # вместо трёх «Web3 …», ~6/сут, все про web3
      # CIS / Russian-speaking роли
      - { text: "Менеджер СНГ", field: name }
      - "Комьюнити менеджер крипто"
      - "Русскоязычная поддержка"
      - "CIS operations"
      # Entry/junior — целевой сегмент (обучающие роли, низкий барьер)
      - "Стажёр крипто"
      - { text: "Младший специалист поддержки", field: name }
      - "Оператор поддержки крипто"
      - "Junior crypto operations"
      - { text: "Ассистент операционный", field: name }
      # AI automation (любая индустрия)
      - "AI automation specialist"
      - { text: "Automation engineer", field: name }
      - { text: "Автоматизация процессов", field: name }
      - "n8n разработчик"
      - "No-code разработчик"
      # Точное название профессии на русском рынке. Держать отдельным запросом:
      # существующие запросы про автоматизацию не находят его ВООБЩЕ — замер
      # 15.08.2026 по шести запросам ("AI automation", "Automation engineer",
      # "Автоматизация процессов", "n8n разработчик", "No-code разработчик",
      # "AI automation specialist") дал 157 вакансий и НИ ОДНОЙ со словом
      # «интегратор» в заголовке.
      #
      # История, чтобы не переигрывать: сначала этот запрос был отклонён замером
      # («+2 сквозь гейт, обе про продажи»). Вывод оказался неверным — причина была
      # не в запросе, а в criteria.yaml: роль ai_automation не знала слова
      # «AI-интегратор», и живая вакансия получала 0 баллов с причиной «нет ролевых
      # ключевых слов». После починки словаря те же вакансии дают 50 баллов.
      - "AI-интегратор"
      # ДОБАВЛЕНЫ ЗАМЕРОМ 26.08.2026 (28 запросов-кандидатов, 518 вакансий, у 516
      # выкачано полное описание). Существующие 46 запросов (база 845) находили
      # только 11 из 40 подошедших вакансий — эти восемь возвращают ещё 29.
      # Сквозной выхлоп восьмёрки: 206 вакансий → 76 сквозь гейт → 36 подошедших.
      #
      # ⚠️ «n8n» намеренно БЕЗ слова «разработчик»: уточнение сужает выдачу до
      # вакансий на программистов. Голое «n8n» — лучший запрос из всех замеренных
      # (12 подошедших), «n8n разработчик» оставлен выше как отдельный срез.
      - "n8n"
      - "Claude Code"
      - "нейросети автоматизация"
      - "AI-ассистент разработка"
      - "инженер ИИ-автоматизаций"
      - "инженер по AI-автоматизации"
      - "ИИ автоматизация процессов"
      - "AI Automation Engineer"
      # Добавлен 26.08.2026 отдельным замером англоязычных титулов в автоматизации.
      # Из 10 проверенных англоязычных запросов (286 вакансий) только этот дал
      # НАСТОЯЩИЕ новые: 2 рекомендованных, включая «Специалист по автоматизации
      # бизнес-процессов» за 200 000.
      - "Workflow Automation"
      # Добавлены 27.08.2026. Повод: вакансия «Менеджер по внедрению и сопровождению
      # AI-продукта» (Опен Сервис) — лучшее совпадение по требованиям за неделю —
      # НЕ СОБИРАЛАСЬ вообще: её не было в базе из 1224 вакансий по всем 67 запросам.
      # Замер девяти кандидатов по точности заголовков:
      #   "AI-продукт"                37 вакансий, 73% профильных, 0 шума  ← лучший
      #   "сопровождение AI-продукта" 21 вакансия, 48% профильных, 0 шума,
      #                               нашёл 3 целевые вакансии из 4
      - "AI-продукт"
      - "сопровождение AI-продукта"
      # ОТКЛОНЕНЫ ТЕМ ЖЕ ЗАМЕРОМ — выглядят логично, но тащат 1С, CRM и Битрикс:
      #   "менеджер по внедрению"      2% профильных (!)
      #   "руководитель внедрения"    10%
      #   "внедрение и сопровождение" 11%
      #   "специалист по внедрению"   18%, 8 вакансий шума
      # Не переоткрывать без нового замера.
      # ОТКЛОНЕНЫ ТЕМ ЖЕ ЗАМЕРОМ — англоязычные титулы в автоматизации это ДРУГАЯ
      # ПРОФЕССИЯ, а не другой сегмент рынка (в отличие от продаж ниже). Пропущенное
      # ими — Senior ML Engineer, Data Scientist, Computer Vision, MLOps, Tech Lead
      # Python: роли с самостоятельным кодом. А `Automation Specialist` дал 7
      # «рекомендованных», и все семь — QA Automation Engineer на Java/Python, то есть
      # ровно тот SDET-флуд, который criteria.yaml отсекает намеренно. Не переоткрывать:
      # "AI Engineer", "ML Engineer", "Automation Specialist", "Integration Engineer",
      # "Solutions Engineer", "Prompt Engineer", "AI Developer", "LLM Engineer",
      # "AI Solutions Architect", "RPA developer", "Data Engineer".
      #
      # ── ДОРОЖКА А: продажи B2B в IT/финтех/крипто (добавлено 26.08.2026) ──────────
      # Повод: в конфиге НЕ БЫЛО НИ ОДНОГО запроса про продажи, хотя замер рынка
      # (498 вакансий с раскрытой вилкой) показал, что это направление с медианой
      # 120 000 и входом без обучения — на 8 годах опыта владельца.
      # Замер русских запросов: 179 вакансий → 35 сквозь гейт → 25 рекомендованных.
      # Проверка перекрытия: из 5 найденных «входящих» вакансий база из 54 запросов
      # видела ровно ОДНУ.
      # ⚠️ Отрасль в запросе обязательна: продажи B2B в технологичном сегменте дают
      # медиану 120 000 (n=79), вне его — 80 000 (n=25).
      # 18.10.2026: из дорожки оставлены узкие отраслевые запросы (в их окнах есть
      # аккаунт/CSM: «…финтех» 9 из 36), «…IT» сужен до названия; широкие и
      # англоязычные «охотничьи» удалены — см. список УДАЛЕНЫ в начале search_queries.
      - "менеджер по продажам финтех"
      - { text: "менеджер по продажам IT", field: name }
      - "менеджер по продажам SaaS"
      - "менеджер по продажам криптовалюта"
      - "менеджер по продажам блокчейн"
      # ОТКЛОНЕНЫ ЗАМЕРОМ: "sales", "sales manager", "sales менеджер" — HH по ним
      # отдаёт русскоязычные вакансии, где слово попалось в тексте: 40 результатов и
      # НОЛЬ англоязычных заголовков у каждого. Пустая трата трёх запросов.
      # ОТКЛОНЕНЫ ТЕМ ЖЕ ЗАМЕРОМ 26.08.2026 — «инструментальные» запросы. Точность
      # по маркеру у них почти 100% (Cursor 36/36, Codex 24/24, вайб-кодинг 22/22),
      # но вайбкодинг просят у ДЕЙСТВУЮЩИХ разработчиков: Backend Node.js, Fullstack,
      # PHP/Laravel. Сквозной итог четырнадцати таких запросов: 297 вакансий → 60
      # сквозь гейт → 7 подошедших (2%) против 17% у восьмёрки выше. Не переоткрывать:
      # "Cursor разработка", "Codex", "GitHub Copilot", "вайбкодинг", "вайб-кодинг",
      # "vibe coding", "вайбкодер", "prompt engineer", "промпт-инженер",
      # "RAG разработчик", "AI разработчик", "LLM инженер", "AI engineer",
      # "AI продукт менеджер".
      # ОТКЛОНЕНЫ ЗАМЕРОМ (после починки словаря, 15.08.2026) — шумные, ноль сквозь
      # гейт: "внедрение ИИ" и "интеграция ИИ" (HR-аналитик, руководители отделов),
      # "AI агент" и "RAG разработчик" (backend R&D), "чат-бот разработчик" (QA),
      # "интеграция API" (1С, ERPNext), "AI ассистент" (личные ассистенты).
      # РФ-крипто под волну регулирования (RU_CRYPTO_MARKET_MAP, 22.07)
      - "AML аналитик криптовалюта"
      - "ЦФА оператор"
      - "Цифровой рубль тестировщик"
      - "Оператор криптообменник"
      - "KYC специалист крипто"
      - "Комплаенс криптовалюта"
      # Отслеживаемые РФ-работодатели (карта рынка). Текстовый запрос с названием
      # ловит и вакансии агентств, где работодатель назван в тексте; основная
      # слежка за работодателями — `employer_ids` ниже.
      # ABCEX УБРАН 15.09.2026: санкции UK (26.05.2026) и ЕС (23.07.2026), см.
      # employer_blocklist в criteria.yaml. Не возвращать.
      - "BitOK"
      - "Bitbanker"
      # ДОБАВЛЕНЫ ЗАМЕРОМ 15.09.2026 (RU_CRYPTO_MARKET_MAP §6). Метод: база — выдача
      # 68 текущих запросов (1329 вакансий); кандидаты — 24 запроса; их НОВЫЕ вакансии
      # скорились боевым путём (RSS → pre_filter → полное описание мягким отказам →
      # повторный pre_filter). Число = новых рекомендованных / из них живых.
      - "цифровые валюты"            # 4/3  язык 282-ФЗ: методологи ЦВ Сбера, 1–3 года
