# Критерии целевых ролей (Этап 3).
# Источник правды для смысла: docs/TARGET_CRITERIA.md
# Эталон логики (только справочник, НЕ модуль): docs/target_criteria_REFERENCE.py
# Логика, которая это использует: src/matcher/pre_filter.py (score_job/passes_pre_filter)
#
# Английский A1–A2 — реальный барьер кандидата. Поэтому требование сильного
# английского штрафует балл (сильнее для web3_support), а русскоязычные/CIS
# команды балл повышают.

# ── Глобальные стоп-слова: reject для ЛЮБОЙ роли ──────────────────────────────
global_hard_exclude:
  # неоплата
  - "unpaid"
  - "volunteer only"
  - "equity only"
  - "no salary"
  - "for free"
  # скам-сигналы
  - "recruitment fee"
  - "registration fee"
  - "processing fee"
  - "pay to apply"
  - "send funds"
  - "send crypto"
  - "upfront payment"
  - "training fee"
  # чисто разработческие роли (нужен код, которого пока нет)
  - "solidity developer"
  - "smart contract developer"
  - "smart contract engineer"
  - "rust developer"
  - "protocol engineer"
  - "blockchain developer"
  - "frontend developer"
  - "front-end developer"
  - "backend developer"
  - "back-end developer"
  - "full stack developer"
  - "full-stack developer"
  - "software engineer"
  - "staff engineer"
  - "devops engineer"

# Какие требования английского считать ЖЁСТКИМ барьером (у кандидата A1–A2).
# Модальность определяется в pre_filter._english_modality:
#   spoken  — «spoken/verbal English», созвоны, переговоры → недоступно, режем
#   generic — «fluency in English» без уточнения модальности → режем
#   written — «strong WRITTEN English» → НЕ режем: закрывается переводчиком/AI,
#             вместо отсева мягкий штраф weights.english_written_only
# Чтобы вернуть прежнее поведение (резать всё) — добавь сюда "written".
#   level_b — «English B1/B2» → НЕ режем: мягкий штраф weights.english_level_b
english_gate_levels:
  - spoken
  - generic

# ── Общие списки (одинаковы для обеих ролей) ──────────────────────────────────
english_penalty:
  - "native english"
  - "native-level english"
  - "fluent english"
  - "fluent in english"
  - "excellent english"
  - "perfect english"
  - "strong command of english"
  - "c1"
  - "c2"
  - "english c1"
  - "english c2"
  # RU-формулировки требования сильного английского (барьер кандидата)
  - "свободный английск"
  - "разговорный английск"
  - "английский на уровне"
  - "уровень носителя"
  - "носителя английск"
  - "английский c1"
  - "английский c2"

# CIS / русскоязычная доработка — переиспользуется из существующей части
# pre_filter.py (та же логика, один источник списка терминов).
english_boost:
  - "russian"
  - "russian-speaking"
  - "русск"
  - "cis"
  - "снг"
  - "ru community"

