# ── Веса ────────────────────────────────────────────────────────────────────
weights:
  gate_base: 10
  title_strong: 40
  title_weak: 20
  boost_each: 6
  boost_cap: 30
  penalize_each: -12
  penalize_cap: -36
  senior: -6
  remote: 10
  relocation: 8
  # -18 → -30 (05.08.2026, решение владельца по замеру): офисные вакансии в
  # странах вне списка релокации — 37% проходящего потока, и все требуют визу
  # и переезд туда, куда кандидат не планирует (Singapore, Hong Kong, New York,
  # Malta). При -18 их перебивал сильный заголовок: Gemini «Prediction Markets
  # Intern» в Нью-Йорке (офис 3 дня в неделю) набирал 46 и отправлялся.
  # -30 отсекает рутинные, но оставляет исключительно сильные совпадения (70+),
  # где может быть релокационный пакет.
  onsite: -30
  # Офис за рубежом, НО вакансия требует русский язык — компания уже нанимает
  # русскоязычных и обычно решает визу/релокацию. Такие рассматриваем: штраф
  # мягкий, вакансия остаётся в выдаче (решение владельца 05.08.2026).
  onsite_ru_desk: -10
  english_penalty_each: -14
  english_boost: 10
  # Требуется только ПИСЬМЕННЫЙ английский: барьер преодолим переводчиком/AI,
  # поэтому мягкий штраф вместо отсева (решение владельца 05.08.2026).
  # Замер 05.08.2026 по батчу 2750: при -8 такие вакансии не доходят вовсе
  # (Nansen Support 38 < порога 42), при -4 доходят (44), при 0 — 50.
  # -4 = «видно, но ранжируется ниже равноценной вакансии без английского».
  english_written_only: -4
  # Уровень назван числом B1/B2 — «дотягиваемо, стоит посмотреть», в отличие от
  # размытого «fluent». C1/C2 остаются жёстким отсевом. Решение владельца
  # 14.08.2026. Штраф калибруется замером — см. скилл criteria-ab.
  english_level_b: -6
  entry: 8            # entry/junior/обучающие роли — низкий барьер, целевой сегмент

