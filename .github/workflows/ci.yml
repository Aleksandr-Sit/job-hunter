name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ruff закреплён: новая версия приносит новые проверки и красит CI без
          # правок кода. Поднимать осознанно, вместе с локальным ruff.
          pip install pytest ruff==0.16.0

      - name: Lint (ruff)
        run: ruff check src/ tests/ tools/

      - name: Tests (pytest)
        run: pytest
